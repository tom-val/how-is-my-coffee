name: EAS build (manual)

# OPTIONAL — this workflow does nothing useful until EAS is initialised for the app:
#   1. `cd app && npx eas-cli init` (creates the EAS project and app/eas.json),
#   2. commit app/eas.json with development / preview / production profiles,
#   3. add an EXPO_TOKEN repository secret (Expo account -> Access tokens).
# Until then it will fail at the `eas build` step. Native builds are deliberate and rare: run this
# when native deps or config change, or to cut a shareable internal/store build. The web build ships
# automatically via deploy-prod.yml and is unaffected.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Target platform
        required: true
        default: all
        type: choice
        options: [ios, android, all]
      profile:
        description: EAS build profile (must exist in app/eas.json)
        required: true
        default: preview
        type: choice
        options: [preview, production]

permissions:
  contents: read

jobs:
  build:
    name: EAS build (${{ inputs.profile }} / ${{ inputs.platform }})
    runs-on: ubuntu-latest
    # The EXPO_TOKEN secret is scoped to the Prod GitHub environment; without this line the job
    # sees an empty secret and eas-cli asks for a login.
    environment: Prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # eas-cli requires Node >= 22 since v22.4
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - working-directory: app
        run: |
          npm ci
          eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} \
            --non-interactive --no-wait
