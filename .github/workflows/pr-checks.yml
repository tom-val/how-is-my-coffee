name: PR checks

on:
  pull_request:
    branches: [main]

# One run per PR: a new push supersedes the in-flight checks.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - run: dotnet restore backend/Coffee.slnx
      - run: dotnet build backend/Coffee.slnx --no-restore -c Release
      - run: dotnet test backend/Coffee.slnx --no-build -c Release

  app:
    name: App (Expo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - run: npm run lint
        working-directory: app
      # Catches anything that only breaks when the web bundle is actually built (missing native
      # shims, bad imports). The output is thrown away here; deploy.yml rebuilds it with the real API URL.
      - run: npm run export:web
        working-directory: app

  infra:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra
      # -backend=false: PR checks never touch the remote state or need AWS credentials.
      - name: Validate prod
        working-directory: infra/environments/prod
        run: |
          terraform init -backend=false -input=false
          terraform validate
