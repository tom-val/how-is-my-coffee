name: Admin (manual)

# Runs an operator command from backend/tools/Coffee.Admin against the PRODUCTION table using the
# same OIDC deploy role as the deploy workflow — for the cases where nobody has AWS credentials on
# a laptop. Every command is idempotent; only delete-account removes data, and only the named user's.
#
#   backfill-indexes   one-off after the rework: gives PLACE#…/META and USERNAME# rows written by
#                      the old Node backend their GSI1 keys, so Discover and username search can
#                      see them. Safe to re-run; rows that already have keys are untouched.
#   delete-account     deletes the account named in `username` and all of its data, exactly like
#                      in-app deletion — for people who cannot sign in and ask by e-mail (the
#                      Support / delete-account pages promise this). Irreversible.

on:
  workflow_dispatch:
    inputs:
      command:
        description: Admin command to run
        required: true
        default: backfill-indexes
        type: choice
        options: [backfill-indexes, delete-account]
      username:
        description: Username (delete-account only)
        required: false
        type: string

permissions:
  id-token: write # OIDC → AWS
  contents: read

jobs:
  admin:
    name: ${{ inputs.command }}
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Run ${{ inputs.command }}
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
          # Same name Terraform gives the photos bucket (coffee-app-photos-<account>).
          Photos__Bucket: coffee-app-photos-${{ vars.AWS_ACCOUNT_ID }}
          COMMAND: ${{ inputs.command }}
          USERNAME: ${{ inputs.username }}
        run: |
          if [ "$COMMAND" = "delete-account" ]; then
            if [ -z "$USERNAME" ]; then echo "username is required for delete-account" >&2; exit 2; fi
            dotnet run --project backend/tools/Coffee.Admin -- delete-account "$USERNAME" --table CoffeeApp
          else
            dotnet run --project backend/tools/Coffee.Admin -- "$COMMAND" --table CoffeeApp
          fi
